name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Force username to lowercase to prevent build tag failures
      - name: Set Image Tag
        id: vars
        run: |
          USERNAME=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=${USERNAME}/bfgf-school-comfy:latest" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.vars.outputs.tag }}
          # Use registry caching instead of GHA to bypass the 10GB limit
          cache-from: type=registry,ref=${{ steps.vars.outputs.tag }}
          cache-to: type=inline
          # Export with zstd compression for 5x faster Vast pulling
          outputs: type=image,name=${{ steps.vars.outputs.tag }},push=true,compression=zstd,compression-level=3,force-compression=true